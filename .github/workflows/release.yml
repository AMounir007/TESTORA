name: Release

# Every push to main/master: bump patch version -> update pom.xml + CHANGELOG.md -> commit [skip ci] -> tag
# -> GitHub Release with user-focused notes (what followers see in their feed) -> JitPack build.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Only one release at a time; never cancel a release that is half-way through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_VERSION: 1.0.0            # first version to release when no tag exists (or latest tag is lower)
  JITPACK_GROUP: com.github.AMounir007
  JITPACK_ARTIFACT: TESTORA

jobs:
  release:
    # Loop guard: ignore our own release commits and the bot itself.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$LATEST" ]; then
            VERSION="$BASE_VERSION"
          else
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$BASE_VERSION" | sort -V | tail -n 1)
            if [ "$HIGHEST" = "$BASE_VERSION" ] && [ "$LATEST" != "$BASE_VERSION" ]; then
              VERSION="$BASE_VERSION"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          # Never reuse an existing tag.
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          done
          echo "Latest tag: ${LATEST:-none} -> releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Set version in pom.xml
        run: >
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set
          -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Build (verify it compiles and installs)
        run: mvn -B -ntp clean install -DskipTests

      - name: Generate release notes and stamp CHANGELOG.md
        id: notes
        run: |
          bash .github/scripts/release-notes.sh '${{ steps.ver.outputs.version }}' '${{ steps.ver.outputs.prev }}' '${{ github.repository }}'
          echo "title=$(cat release-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit version and tag
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml CHANGELOG.md
          git commit -m "chore(release): $VERSION [skip ci]" || echo "Nothing to commit for $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          make_latest: true

      - name: Trigger JitPack build and wait
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          URL="https://jitpack.io/api/builds/${JITPACK_GROUP}/${JITPACK_ARTIFACT}/${VERSION}"
          echo "JitPack: $URL"
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o jitpack.json -w '%{http_code}' "$URL" || echo 000)
            STATUS=$(jq -r '.status // empty' jitpack.json 2>/dev/null || true)
            echo "[$i/60] http=$CODE status=${STATUS:-pending}"
            case "$STATUS" in
              ok)    echo "JitPack build succeeded."; exit 0 ;;
              error) echo "JitPack build FAILED. Log: https://jitpack.io/com/github/AMounir007/${JITPACK_ARTIFACT}/${VERSION}/build.log"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for JitPack (20 min). Check https://jitpack.io/#AMounir007/${JITPACK_ARTIFACT}/${VERSION}"
          exit 1
