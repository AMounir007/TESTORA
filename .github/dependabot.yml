version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      selenium-appium:
        patterns:
          - "org.seleniumhq.selenium*"
          - "io.appium*"
      testing:
        patterns:
          - "org.junit*"
          - "io.rest-assured*"
          - "org.assertj*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
